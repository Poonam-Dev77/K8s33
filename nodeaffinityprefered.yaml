apiVersion: v1
kind: Pod
metadata: 
  name: my-Pod
  lables:
    app: myapp 
spec: 
  affinity:
    nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: type
            operator: In
            values: 
            - backend
    containers:
      - name: nginx-cont
        image: nginx:latest
        ports:
        - containerPort: 80