apiVersion: v1
kind: Pod

metadata:
  name: my-pod
  labels:
    app: myapp

spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: type
                operator: In
                values:
                  - frontend

  containers:
    - name: nginx-cont
      image: nginx:latest
      ports:
        - containerPort: 80