apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: my-ss 
  labels:
    app: ss
spec: 
  replicas: 2
  selector:
    matchLabels:
      labels:
        app: ss
  template:
    metadata: 
      labels:
        app: ss
    spec:
      containers:
       - name: mysql-container
         image: mysql:8.0
         ports:
           - containerPort: 3306

         env: 
         - name: MYSQL_ROOT_PASSWORD 
           valueFrom:     
             secretKeyRef:
                  name: mysql-secret
                  key: mysql_root_password
     