apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-Deployment
  lables:
    app: Deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy 
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
    lables:
      app: deploy
    spec:
      containers:
      - name: nginx-cont
        image: nginx:latest
        ports:
          - name: nginx-port
            containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: deploy-Svc 
  lables:
    app: deploy
spec:
  type: NodePort
  selector:
    app: deploy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30002      