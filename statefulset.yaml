apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: my-ss 
  lables:
    app: ss
spec:
  replicas: 2
  selector:
    matchLables:
      app: ss
  template:
    metadata:
      lables:
        app: ss
    spec:
      containers:
       - name: mysql-container 
         image: mysql:8.0
         ports:
          - containerPort: 3306

         env:
         - name: MYSQL_ROOT_PASSWORD
           value: root 
         - name: MYSQL_USER
           value: "admin"               
         - name: MYSQL_PASSWORD
           value: "admin"
         - name: MYSQL_DATABASE
             